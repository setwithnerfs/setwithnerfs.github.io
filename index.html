  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0d;
      --surface: #1a1917;
      --border: #2e2c29;
      --text: #f0ede8;
      --text-muted: #7a766f;
      --purple: #c084fc;
      --teal: #2dd4bf;
      --card-bg: #f5f0e8;
      --selected: #2dd4bf;
      --error: #f87171;
      --success: #4ade80;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--teal); }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--teal); color: var(--teal); }
    .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Game sub-bar — removed, stats now live below board ── */

    .stat { display: flex; align-items: center; gap: 8px; }
    .stat-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .stat-value { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }

    .btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--teal); color: var(--teal); }
    .btn.active { border-color: var(--teal); color: var(--teal); }
    .btn-primary { background: var(--teal); border-color: var(--teal); color: #0f0e0d; font-weight: 500; }
    .btn-primary:hover { background: #26bfaa; border-color: #26bfaa; color: #0f0e0d; }

    /* ── Nav Tabs ── */
    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      background: var(--bg);
      gap: 0;
      position: sticky;
      top: 55px;
      z-index: 9;
    }
    .nav-tab {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 14px 18px 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      margin-bottom: -1px;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--teal); border-bottom-color: var(--teal); }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Arcana Selection Screen (full-screen overlay) ── */
    /* ── Profile Modal ── */
    .profile-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .profile-modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .profile-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px 24px;
      width: 320px;
      max-width: calc(100vw - 40px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: translateY(12px);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .profile-modal-overlay.open .profile-modal {
      transform: translateY(0);
    }
    .profile-modal-title {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .profile-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .profile-name-row {
      display: flex;
      gap: 8px;
    }
    .profile-name-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .profile-name-input:focus { border-color: var(--teal); }
    .profile-save-btn {
      background: var(--teal);
      border: none;
      border-radius: 6px;
      color: #0f0e0d;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .profile-save-btn:hover { background: #26bfaa; }
    .profile-save-btn:disabled { opacity: 0.4; cursor: default; background: var(--teal); }
    .profile-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 16px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      width: 100%;
    }
    .profile-google-btn:hover { border-color: var(--teal); color: var(--teal); }
    .profile-google-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .profile-status {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .profile-status strong { color: var(--text); }
    .profile-error { font-size: 11px; color: var(--error); margin-top: 4px; }
    .profile-success { font-size: 11px; color: var(--success); margin-top: 4px; }
    .profile-divider { border: none; border-top: 1px solid var(--border); margin: 0; }
    .profile-modal-close {
      position: absolute;
      top: 0; right: 0;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
    }

    .profile-modal-wrap { position: relative; }

    .lb-name {
      font-size: 11px;
      color: var(--text-muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-name-pill {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: none;
      font-family: 'DM Mono', monospace;
    }
    .header-name-pill:hover { border-color: var(--teal); color: var(--teal); }
    .header-name-pill.linked { color: var(--teal); border-color: var(--teal); }

    .arcana-screen {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: 95px; /* below sticky header (55px) + sticky nav (40px) */
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 36px 20px 48px;
      background: rgba(15, 14, 13, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .arcana-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Active Modifier Mini-Cards ── */
    .modifier-pills {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .modifier-mini-card {
      width: 28px;
      height: 46px;
      background: var(--card-bg);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      overflow: hidden;
      flex-shrink: 0;
    }
    .modifier-mini-card svg { display: block; }
    .arcana-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
    }
    .arcana-cards {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .arcana-card {
      width: 110px;
      height: 190px;
      background: var(--card-bg);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 10px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 2px transparent;
      transition: box-shadow 0.15s, transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .arcana-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 2px var(--border); }
    .arcana-card.selected { box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 3px var(--teal); transform: translateY(-4px) scale(1.03); }
    .arcana-numeral {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      color: #9a9590;
      letter-spacing: 3px;
      height: 14px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .arcana-art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .arcana-name {
      font-family: 'Fraunces', serif;
      font-size: 10px;
      color: #3a3630;
      font-weight: 300;
      letter-spacing: 0.5px;
      height: 16px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .arcana-effect {
      font-family: 'DM Mono', monospace;
      font-size: 7px;
      color: #9a9590;
      letter-spacing: 1px;
      text-transform: uppercase;
      height: 12px;
      display: flex;
      align-items: center;
    }
    .arcana-start {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--teal);
      color: #0f0e0d;
      border: none;
      border-radius: 6px;
      padding: 12px 36px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .arcana-start:hover { background: #26bfaa; }
    @keyframes pulse-rays {
      0%   { opacity: 1;    transform: scale(1); }
      50%  { opacity: 0;    transform: scale(0.82); }
      100% { opacity: 1;    transform: scale(1); }
    }
    .sun-rays { animation: pulse-rays 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin-ouroboros {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .ouroboros-spin { animation: spin-ouroboros 22s linear infinite; transform-box: fill-box; transform-origin: center; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 32px;
      gap: 0;
    }

    .deck-count { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; }

    /* ── Below-board stats panel ── */
    .below-board {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px 0 8px;
    }
    .below-divider {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }
    .below-timer {
      font-size: 52px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1;
    }
    .below-score-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 4px;
    }
    .below-score-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .below-score-value {
      font-size: 22px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* ── Spring board (absolute-positioned, matches repo animation model) ── */
    .board-container {
      width: 100%;
      max-width: 860px;
      position: relative;
      overflow: hidden;
      transition: height 0.55s cubic-bezier(0.4,0,0.2,1);
      border-radius: 6px;
    }

    .card-sprite {
      position: absolute;
      will-change: transform, opacity;
    }

    .set-card {
      width: 100%; height: 100%;
      background: var(--card-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow 0.12s;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .set-card:hover { box-shadow: 0 0 0 2px var(--border), 0 4px 20px rgba(0,0,0,0.4); }
    .set-card.selected { box-shadow: 0 0 0 3px var(--selected); }

    .card-key-label {
      position: absolute;
      top: 5px;
      left: 7px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: #9a9590;
      letter-spacing: 0.5px;
      pointer-events: none;
      line-height: 1;
      text-transform: uppercase;
    }
    .card-sprite.leaving { pointer-events: none; z-index: 2; }
    .card-sprite.moving  { z-index: 1; }

    .set-card.flash-success { animation: flash-success 0.5s ease forwards; }
    .set-card.flash-error   { animation: flash-error   0.9s ease-out forwards; }

    @keyframes flash-success {
      0%   { box-shadow: 0 0 0 0px rgba(74, 222, 128, 0); }
      30%  { box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.35); }
      100% { box-shadow: 0 0 0 0px rgba(74, 222, 128, 0); }
    }
    @keyframes flash-error {
      0%   { box-shadow: 0 0 0 3px rgba(248, 113, 113, 1); }
      100% { box-shadow: 0 0 0 3px rgba(248, 113, 113, 0); }
    }

    .card-symbols {
      display: flex; align-items: center; justify-content: center;
      gap: 4%; width: 92%; height: 80%;
    }

    .end-screen {
      display: none; flex-direction: column; align-items: center;
      gap: 24px; padding: 60px 24px; text-align: center;
    }
    .end-screen.show { display: flex; }
    .end-title { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 300; color: var(--teal); }
    .end-stats { display: flex; gap: 40px; }
    .end-stat-label { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .end-stat-value { font-size: 32px; font-weight: 500; }

    #svg-defs { position: fixed; z-index: -1; width: 0; height: 0; overflow: hidden; }

    /* ── Player Panel ── */
    .player-panel-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 28px 20px 48px;
      max-width: 600px;
      margin: 0 auto;
    }
    .player-search-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .player-search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .player-search-input:focus { border-color: var(--teal); }
    #player-results-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .player-stats-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-name-display {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 300;
      color: var(--teal);
      letter-spacing: -0.3px;
    }
    .player-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }
    .player-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-stat-card-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .player-stat-card-value {
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      color: var(--text);
    }
    .player-chart-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .player-chart-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .player-chart-filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .player-chart-filter-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .player-chart-wrap {
      width: 100%;
      background: var(--bg);
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }
    .player-chart-wrap canvas {
      display: block;
      width: 100% !important;
    }

    .player-empty {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-align: center;
      padding: 32px 0;
    }
    .player-recent-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-mini-mods {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    /* ── History ── */
    .history-panel {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 2px;
    }
    .history-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      padding-right: 2px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .history-entry {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      animation: fadeSlideIn 0.2s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .history-num {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      text-align: left;
      flex-shrink: 0;
      width: 18px;
    }
    .history-cards { display: flex; gap: 8px; align-items: center; justify-content: center; flex: 1; }
    .history-time {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .hist-card {
      width: calc(32px * 1.6);
      height: 32px;
      background: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      flex-shrink: 0;
    }
    .hist-card svg { display: block; width: 100%; height: 100%; }
    /* ── Leaderboard Panel styles moved to lb-drawer ── */
    .lb-panel-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 28px 20px 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── Leaderboard ── */
    .lb-filter-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .lb-filter-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .lb-mini-card {
      width: 36px;
      height: 58px;
      background: var(--card-bg);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.38;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 0 2px transparent;
      transition: opacity 0.15s, box-shadow 0.15s, transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
      overflow: hidden;
      flex-shrink: 0;
    }
    .lb-mini-card:hover { opacity: 0.65; transform: translateY(-2px); }
    .lb-mini-card.active { opacity: 1; box-shadow: 0 2px 12px rgba(0,0,0,0.5), 0 0 0 2px var(--teal); transform: translateY(-4px) scale(1.08); }
    .lb-mini-card svg { display: block; }
    .lb-list {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      
    }
    .lb-list::-webkit-scrollbar { width: 4px; }
    .lb-list::-webkit-scrollbar-track { background: transparent; }
    .lb-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .lb-entry {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .lb-rank {
      font-size: 11px;
      color: var(--text-muted);
      width: 22px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .lb-rank.gold   { color: #f5c842; }
    .lb-rank.silver { color: #aab0bb; }
    .lb-rank.bronze { color: #cd7c4a; }
    .lb-mods {
      display: flex;
      gap: 5px;
      flex: 1;
      align-items: center;
    }
    .lb-mod-pip {
      width: 20px;
      height: 33px;
      background: var(--card-bg);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lb-mod-pip svg { display: block; }
    .lb-no-mods {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .lb-time {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    .lb-empty {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 1px;
      padding: 32px 0;
    }

    /* ── Leaderboard entry clickable ── */
    .lb-entry {
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .lb-entry:hover { background: #222; border-color: var(--teal); }

    /* ── Replay Modal ── */
    .replay-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 40px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .replay-overlay.hidden { display: none; }
    .replay-modal {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .replay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .replay-title {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 300;
      color: var(--teal);
      letter-spacing: -0.3px;
    }
    .replay-meta {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      gap: 18px;
      align-items: center;
      margin-top: 2px;
    }
    .replay-meta-mods {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .replay-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .replay-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .replay-btn:hover { border-color: var(--teal); color: var(--teal); }
    .replay-btn.active { border-color: var(--teal); color: var(--teal); background: rgba(45,212,191,0.08); }
    .replay-btn-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .replay-btn-close:hover { border-color: var(--error); color: var(--error); }
    .replay-progress {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      margin-left: auto;
    }
    .replay-speed-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .replay-speed-row input[type=range] {
      width: 90px;
      accent-color: var(--teal);
    }
    .replay-board-wrap {
      width: 100%;
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
    }
    .replay-board-inner {
      position: relative;
      transition: height 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .replay-step-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .replay-set-found {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      background: rgba(74,222,128,0.06);
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 6px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .replay-set-found .hist-card { width: 48px; height: 30px; }
    .replay-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .replay-scrubber {
      width: 100%;
      accent-color: var(--teal);
      cursor: pointer;
    }
    .replay-stat-row {
      display: flex;
      gap: 24px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .replay-stat-row span { color: var(--text); }

    /* ── Toast notifications ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
      padding: 9px 18px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.toast-success { border-color: var(--success); color: var(--success); }
    .toast.toast-error   { border-color: var(--error);   color: var(--error);   }
    .toast.toast-info    { border-color: var(--teal);    color: var(--teal);    }
  </style>
</head>
<body>



<!-- ── Toast Container ── -->
<div id="toast-container"></div>

<!-- ── Replay Modal ── -->
<div class="replay-overlay hidden" id="replay-overlay">
  <div class="replay-modal">
    <div class="replay-header">
      <div>
        <div class="replay-title">Replay</div>
        <div class="replay-meta">
          <span id="replay-meta-time">—</span>
          <div class="replay-meta-mods" id="replay-meta-mods"></div>
        </div>
      </div>
      <button class="replay-btn-close" onclick="closeReplay()" title="Close">✕</button>
    </div>

    <div class="replay-controls">
      <button class="replay-btn" id="replay-btn-prev" onclick="replayStep(-1)">← Prev</button>
      <button class="replay-btn" id="replay-btn-play" onclick="replayTogglePlay()">▶ Play</button>
      <button class="replay-btn" id="replay-btn-next" onclick="replayStep(1)">Next →</button>
      <div class="replay-speed-row">
        <span>Speed</span>
        <input type="range" id="replay-speed" min="200" max="2000" value="900" step="100" oninput="replayUpdateSpeed()">
        <span id="replay-speed-label">1×</span>
      </div>
      <div class="replay-progress" id="replay-progress">Set 0 / 0</div>
    </div>

    <div>
      <div class="replay-label">Scrub</div>
      <input type="range" class="replay-scrubber" id="replay-scrubber" min="0" value="0" oninput="replayScrub(this.value)">
    </div>

    <div class="replay-board-wrap">
      <div class="replay-board-inner" id="replay-board-inner">
        <div id="replay-board" style="position:relative;"></div>
      </div>
    </div>

    <div id="replay-step-info" class="replay-step-info"></div>

    <div class="replay-stat-row" id="replay-stat-row"></div>
  </div>
</div>

    </mask>

<header>
  <div class="logo">set<span>with</span>nerfs</div>
  <button class="header-name-pill" id="header-name-pill" onclick="openProfileModal()">anon</button>
</header>

<!-- ── Profile Modal ── -->
<div class="profile-modal-overlay" id="profile-modal-overlay" onclick="handleOverlayClick(event)">
  <div class="profile-modal profile-modal-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="profile-modal-title">Profile</div>
      <button onclick="closeProfileModal()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;padding:0;line-height:1;">×</button>
    </div>

    <div class="profile-section">
      <div class="profile-label">Display name</div>
      <div class="profile-name-row">
        <input class="profile-name-input" id="profile-name-input" type="text" maxlength="24" placeholder="your name" />
        <button class="profile-save-btn" id="profile-save-btn" onclick="saveProfileName()">Save</button>
      </div>
      <div id="profile-name-msg"></div>
    </div>

    <hr class="profile-divider" />

    <div class="profile-section" id="profile-google-section">
      <!-- filled by renderProfileModal() -->
    </div>
  </div>
</div>

<nav class="nav-tabs">
  <button class="nav-tab active" id="tab-play" onclick="switchPanel('play')">Play</button>
  <button class="nav-tab" id="tab-leaderboard" onclick="switchPanel('leaderboard')">Leaderboard</button>
  <button class="nav-tab" id="tab-player" onclick="switchPanel('player')">Player</button>
</nav>

<!-- ── Arcana Selection Screen (overlay) ── -->
<div id="arcana-screen" class="arcana-screen">
  <div class="arcana-title">Choose your modifiers</div>
  <div class="arcana-cards">

    <!-- XIX — The Sun → Shade -->
    <div class="arcana-card" id="arc-fill" onclick="toggleArcana('fill')">
      <div class="arcana-numeral">XIX</div>
      <div class="arcana-art">
        <svg width="80" height="80" viewBox="-60 -60 120 120">
          <g fill="#3a3630">
            <g transform="rotate(0)"><polygon points="-6,-30 0,-56 6,-30"/></g>
            <g transform="rotate(45)"><polygon points="-6,-30 0,-56 6,-30"/></g>
            <g transform="rotate(90)"><polygon points="-6,-30 0,-56 6,-30"/></g>
            <g transform="rotate(135)"><polygon points="-6,-30 0,-56 6,-30"/></g>
            <g transform="rotate(180)"><polygon points="-6,-30 0,-56 6,-30"/></g>
            <g transform="rotate(225)"><polygon points="-6,-30 0,-56 6,-30"/></g>
            <g transform="rotate(270)"><polygon points="-6,-30 0,-56 6,-30"/></g>

      <div class="arcana-art">
        <svg width="74" height="74" viewBox="0 0 74 74" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <mask id="moon-mask">
              <rect width="74" height="74" fill="white"/>
              <circle cx="46" cy="28" r="22" fill="black"/>

          <path id="arcana-star-eye" fill="#f5f0e8" d="M -13,0 A 22,22 0 0,0 13,0 A 22,22 0 0,0 -13,0 Z"/>

      <div class="arcana-effect">Clone</div>

    <!-- XXI — The World → Tint -->
    <div class="arcana-card" id="arc-hue" onclick="toggleArcana('hue')">

<script>
// ── Panel toggle ──────────────────────────────────────────────────────────────

// Color animation state (hue arcana modifier)
let animOn    = false;
let animHue   = 0;
let animSpeed = 120;
let animFrame = null;
let animLast  = null;

const CARD_COLORS = ['#9333ea', '#16a34a', '#dc2626'];

// Convert sRGB [0,1] → linear
function toLinear(c) { return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
// sRGB hex → OKLCH {l, c, h}
function hexToOklch(hex) {
  let r = toLinear(parseInt(hex.slice(1,3),16)/255);
  let g = toLinear(parseInt(hex.slice(3,5),16)/255);
  let b = toLinear(parseInt(hex.slice(5,7),16)/255);
  // sRGB → OKLab (via XYZ-D65)
  const l_ = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
  const m_ = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
  const s_ = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  const L  = 0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_;
  const a  = 1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_;
  const bv = 0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_;
  const C  = Math.sqrt(a*a + bv*bv);
  const H  = Math.atan2(bv, a) * 180 / Math.PI;
  return { l: L, c: C, h: ((H % 360) + 360) % 360 };
}
// OKLCH → CSS oklch() string with shifted hue
function shiftHue(hex, shift) {
  const { l, c, h } = hexToOklch(hex);
  const newH = ((h + shift) % 360 + 360) % 360;
  return `oklch(${l.toFixed(4)} ${c.toFixed(4)} ${newH.toFixed(2)})`;
}

function setGradient(i, color) {
  const g = document.getElementById(`grad-${i}`);
  if (!g) return;
  g.querySelectorAll('stop').forEach(s => s.setAttribute('stop-color', color));
}

function applyColors() {
  [0, 1, 2].forEach(i => {
    const col = animOn ? shiftHue(CARD_COLORS[i], animHue) : CARD_COLORS[i];
    setGradient(i, col);
  });
}

function startAnim() {
  if (animFrame) return;
  animLast  = null;
  animFrame = requestAnimationFrame(animTick);
}

function stopAnim() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  animLast = null;
  animHue  = 0;
  applyColors();
}

function animTick(ts) {
  if (animLast !== null) {
    const dt = (ts - animLast) / 1000;
    animHue = ((animHue + animSpeed * dt) % 360 + 360) % 360;
    applyColors();
  }
  animLast  = ts;
  animFrame = requestAnimationFrame(animTick);
}

// ─── Game Logic ───────────────────────────────────────────────────────────────

// Static path strings for each shape (fallback when morph is off)
const SHAPE_PATHS = [
  // squiggle
  "m67.892902,12.746785c43.231313,-6.717223 107.352741,6.609823 121.028973,58.746408c13.676233,52.136585 -44.848649,161.467192 -45.07116,204.650732c4.566246,56.959708 83.805481,87.929227 22.329944,105.806022c-61.475536,17.876795 -126.122496,-1.855045 -143.73294,-41.933823c-17.610444,-40.07878 49.274638,-120.109409 46.14822,-188.091997c-3.126418,-67.982588 -21.873669,-70.257464 -49.613153,-80.177084c-27.739485,-9.919618 5.678801,-52.283035 48.910115,-59.000258z",
  // oval
  "m11.49999,95.866646c0,-44.557076 37.442923,-81.999998 82.000002,-81.999998l12.000015,0c44.557076,0 81.999992,37.442923 81.999992,81.999998l0,206.133354c0,44.557098 -37.442917,82 -81.999992,82l-12.000015,0c-44.557079,0 -82.000002,-37.442902 -82.000002,-82l0,-206.133354z",
  // diamond
  "m100 10-90 190 90 190 90-190-90-190z",
];
const SHAPES  = ['squiggle', 'oval', 'diamond'];
const MASKS   = ['', '', 'url(#mask-stripes)', 'url(#mask-checkers)'];
const BORDERS = ['3px solid', '4px dotted', '6px double'];

function makeCards(symbols, traits) {
  if (traits === 1) return symbols;
  return makeCards(symbols, traits - 1).flatMap(lhs => symbols.map(s => lhs + s));
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateDeck() {
  return shuffleArray(makeCards(['0','1','2'], 4));
}

function cardTraits(card) {
  const z = '0'.charCodeAt(0);
  return {
    color:  card.charCodeAt(0) - z,
    shape:  card.charCodeAt(1) - z,
    shade:  card.charCodeAt(2) - z,
    number: card.charCodeAt(3) - z,
  };
}

function isSet(a, b, c) {
  for (let i = 0; i < 4; i++)
    if ((a.charCodeAt(i) + b.charCodeAt(i) + c.charCodeAt(i)) % 3 !== 0) return false;
  return true;
}

function conjugateCard(a, b) {
  const z = '0'.charCodeAt(0);
  let c = '';
  for (let i = 0; i < a.length; i++) {
    const an = a.charCodeAt(i), bn = b.charCodeAt(i);
    c += String.fromCharCode(an === bn ? an : z * 3 + 3 - an - bn);
  }
  return c;
}

function findSetOnBoard(board) {
  const s = new Set(board);
  for (let i = 0; i < board.length; i++)
    for (let j = i + 1; j < board.length; j++) {
      const c = conjugateCard(board[i], board[j]);
      if (s.has(c) && c !== board[i] && c !== board[j]) return [board[i], board[j], c];
    }
  return null;
}

// ─── Game State ───────────────────────────────────────────────────────────────

let deck = [], board = [], selected = [];
let score = 0, startTime = null, timerInterval = null;
let hintCards = [], gameOver = false;

let initialDeck = []; // saved at game start for replay

function newGame() {
  // Cancel any running spring animation
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; lastTs = null; }
  // Reset morph engine (sprites are about to be wiped, live paths go with them)
  if (morphRaf) { cancelAnimationFrame(morphRaf); morphRaf = null; }
  morphPhase = 'hold'; morphPhaseStart = null; morphShapeIdx = 0;
  // Reset clone engine
  if (cloneRaf) { cancelAnimationFrame(cloneRaf); cloneRaf = null; }
  clonePhaseStart = null;
  // Reset fill engine
  if (fillRaf) { cancelAnimationFrame(fillRaf); fillRaf = null; }
  fillPhaseStart = null;
  // Stop fade engine (restarted below if fadeOn)
  if (fadeRaf) { cancelAnimationFrame(fadeRaf); fadeRaf = null; }
  fadeStart = null;
  // Wipe all sprites
  sprites.clear();
  document.getElementById('board').innerHTML = '';

  deck = generateDeck();
  initialDeck = [...deck]; // save for replay
  board = []; selected = []; score = 0; hintCards = []; gameOver = false;
  gameHistory = [];
  document.getElementById('history-list').innerHTML = '';
  document.getElementById('history-panel').style.display = 'none';
  refillBoard();

  const container = document.getElementById('board-container');
  container.style.display = '';
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('score').textContent = '0';
  clearInterval(timerInterval);
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 500);
  renderBoard();
  updateDeckInfo();
  // Restart morph if it was on
  if (morphOn) startMorph();
  // Restart clone if it was on
  if (cloneOn) startClone();
  // Restart fill if it was on
  if (fillOn) startFill();
  // Restart hue if it was on
  if (animOn) startAnim();
  // Restart fade if it was on
  if (fadeOn) startFade();
}

function refillBoard() {
  const target = Math.max(12, board.length);
  while (board.length < target && deck.length > 0) board.push(deck.pop());
  while (!findSetOnBoard(board) && deck.length > 0) {
    board.push(deck.pop()); board.push(deck.pop()); board.push(deck.pop());
  }
}

// ─── Spring engine (matches @react-spring tension:64 friction:14) ─────────────
// Vanilla JS port of react-spring's Euler-integrated spring physics.

const TENSION  = 64;
const FRICTION = 14;
const MASS     = 1;
const PRECISION = 0.005;

class Spring {
  constructor(from, to) {
    this.pos = from;
    this.vel = 0;
    this.to  = to;
  }
  step(dt) {
    const force = -TENSION * (this.pos - this.to) - FRICTION * this.vel;
    this.vel += (force / MASS) * dt;
    this.pos += this.vel * dt;
  }
  get idle() {
    return Math.abs(this.pos - this.to) < PRECISION && Math.abs(this.vel) < PRECISION;
  }
  get value() { return this.pos; }
}

// ─── Board layout ─────────────────────────────────────────────────────────────

const GAP = 8;

function getLayout() {
  const container = document.getElementById('board-container');
  const W = container.clientWidth || 860;
  const cols = W < 560 ? 3 : 4;
  const cardW = Math.floor((W - GAP * (cols + 1)) / cols);
  const cardH = Math.round(cardW / 1.6);
  return { W, cols, cardW, cardH };
}

function cardTarget(index, layout) {
  const { W, cols, cardW, cardH } = layout;
  const col = index % cols;
  const row = Math.floor(index / cols);
  return {
    x: GAP + col * (cardW + GAP),
    y: GAP + row * (cardH + GAP),
  };
}

function boardHeight(n, layout) {
  const { cols, cardH } = layout;
  const rows = Math.ceil(n / cols);
  return rows * cardH + (rows + 1) * GAP;
}

// ─── Sprite registry ──────────────────────────────────────────────────────────
// Each card on the board has one sprite (DOM + springs).
// Sprites survive re-renders; we just re-target the springs.

const sprites = new Map(); // card string → sprite object
let   rafId   = null;

function getOrCreateSprite(card, entering, layout) {
  if (sprites.has(card)) return sprites.get(card);

  const { W, cardW, cardH } = layout;
  // create DOM
  const el = document.createElement('div');
  el.className = 'card-sprite moving';

  const inner = document.createElement('div');
  inner.className = 'set-card';
  inner.dataset.card = card;
  inner.innerHTML = cardSVG(card, cardH * 0.54);
  const keyLabel = document.createElement('span');
  keyLabel.className = 'card-key-label';
  inner.appendChild(keyLabel);
  inner.addEventListener('click', () => onCardClick(card));
  el.appendChild(inner);

  el.style.width  = cardW + 'px';
  el.style.height = cardH + 'px';

  document.getElementById('board').appendChild(el);

  // Springs: enter from off-screen left
  const startX = entering ? -cardW - GAP : 0;
  const startY = entering ? 0 : 0;

  const sprite = {
    card,
    el,
    inner,
    sx: new Spring(startX, 0),  // will be re-targeted immediately
    sy: new Spring(startY, 0),
    so: new Spring(entering ? 0 : 1, 1),
    leaving: false,
    settled: false,
  };
  sprites.set(card, sprite);
  return sprite;
}

function applySprite(sprite) {
  const x = sprite.sx.value;
  const y = sprite.sy.value;
  const o = sprite.so.value;
  sprite.el.style.transform = `translate(${x}px,${y}px)`;
  sprite.el.style.opacity   = o;
}

let lastTs = null;

function tick(ts) {
  if (lastTs === null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.064); // cap at ~4 frames to avoid huge jumps
  lastTs = ts;

  let anyActive = false;

  for (const [card, sprite] of sprites) {
    const { sx, sy, so } = sprite;
    sx.step(dt); sy.step(dt); so.step(dt);
    applySprite(sprite);

    const idle = sx.idle && sy.idle && so.idle;
    if (!idle) { anyActive = true; }

    if (sprite.leaving && idle) {
      // fully off-screen — remove
      sprite.el.remove();
      sprites.delete(card);
    } else if (!sprite.leaving && idle) {
      // settled — demote to static
      sprite.el.className = 'card-sprite';
    } else {
      anyActive = true;
    }
  }

  if (anyActive) {
    rafId = requestAnimationFrame(tick);
  } else {
    rafId = null;
    lastTs = null;
  }
}

function ensureRaf() {
  if (!rafId) {
    lastTs = null;
    rafId = requestAnimationFrame(tick);
  }
}

// ─── Rendering ────────────────────────────────────────────────────────────────

function currentMorphPath(shapeIdx) {
  // Returns the live morphed path string for a shape index, or null if morph is off
  if (!morphOn) return null;
  return morphCurrentPaths[shapeIdx] || null;
}

function cardSVG(card, size) {
  const { color, shape, shade, number } = cardTraits(card);
  const mask    = MASKS[shade];
  const count   = number + 1;
  const w = size * 0.5, h = size, m = size * 0.08;
  const gradRef = `url(#grad-${color})`;
  // Use the live morph path if available, else fall back to static shape path
  const pathD = morphCurrentPaths[shape] || SHAPE_PATHS[shape];
  // Always render 3 symbols — phantom extras (i >= count) start hidden so
  // the flex layout stays correct; clone animation reveals/positions them.
  let symbols = '';
  for (let i = 0; i < 3; i++) {
    const phantom = i >= count;
    const svgStyle = `margin:0 ${m}px;flex-shrink:0;${phantom ? 'display:none;' : ''}`;

    {
      // All shades use the animated clipPath/stripe structure; fillTick drives
      // them at phase offsets so each shade is anchored to its natural appearance:
      //   shade=2 (stripe) → +0       home ≈ t=0.25  (stripe-hold window)
      //   shade=0 (solid)  → +1/3 cy  home ≈ t=0.58  (solid-hold window)
      //   shade=1 (empty)  → +2/3 cy  home ≈ t=0.92  (empty-hold window)
      const clipId = `fc-${card}-${i}`;
      let stripeRects = '';
      // Initial y/height set to the correct static appearance for this shade;
      // fillTick will take over once the animation is running.
      const initHH = shade === 0 ? FILL_FULL : shade === 2 ? FILL_HALF : 0;
      const initCH = shade === 1 ? 400 : 0;
      for (let si = 0; si < 21; si++) {  // 21 stripes: 20 cover 0–394, 21st covers bottom gap to 400
        const cy = si * 20 + 4;          // centre of stripe i (top-anchored, period=20)
        stripeRects += `<rect data-fill-cy="${cy}" data-fill-shape="${shape}" data-fill-shade="${shade}" x="0" y="${cy - initHH}" width="200" height="${initHH * 2}" fill="${gradRef}"/>`;
      }
      symbols += `<svg width="${w}" height="${h}" viewBox="0 0 200 400" style="${svgStyle}" data-clone="${number}-${i}">
        <defs><clipPath id="${clipId}"><path data-shape="${shape}" d="${pathD}"/></clipPath></defs>
        <g clip-path="url(#${clipId})">
          ${stripeRects}
          <rect data-fill-curtain data-fill-shape="${shape}" data-fill-shade="${shade}" x="0" y="0" width="200" height="${initCH}" fill="var(--card-bg)"/>
        </g>
        <path data-shape="${shape}" d="${pathD}" fill="none" stroke="${gradRef}" stroke-width="18"/>
      </svg>`;
    }
  }
  return `<div class="card-symbols" style="height:100%;">${symbols}</div>`;
}

function renderBoard() {
  const layout = getLayout();
  const { W, cardW, cardH } = layout;
  const h = boardHeight(board.length, layout);

  // Size the container
  const container = document.getElementById('board-container');
  container.style.height = h + 'px';

  // Mark all existing sprites as potentially stale
  const onBoard = new Set(board);

  // Kick off leaving animations for removed cards
  for (const [card, sprite] of sprites) {
    if (!onBoard.has(card) && !sprite.leaving) {
      sprite.leaving = true;
      sprite.el.className = 'card-sprite leaving';
      // exit: fly off to the right
      sprite.sx.to = W + cardW;
      sprite.sy.to = h / 2 - cardH / 2;
      sprite.so.to = 0;
    }
  }

  // Enter / update cards on board
  board.forEach((card, i) => {
    const { x, y } = cardTarget(i, layout);
    const isNew = !sprites.has(card);
    const sprite = getOrCreateSprite(card, isNew, layout);

    if (isNew) {
      // Enter from off-screen left, vertically centred
      sprite.sx.pos = -cardW - GAP;
      sprite.sx.to  = x;
      sprite.sy.pos = h / 2 - cardH / 2;
      sprite.sy.to  = y;
      sprite.so.pos = 0;
      sprite.so.to  = 1;
      sprite.leaving = false;
      sprite.el.className = 'card-sprite moving';
    } else {
      // Reposition
      sprite.sx.to = x;
      sprite.sy.to = y;
      sprite.so.to = 1;
      sprite.leaving = false;
      if (!sprite.sx.idle || !sprite.sy.idle) {
        sprite.el.className = 'card-sprite moving';
      }
    }

    // Sync selected / hint visuals on the inner card
    const inner = sprite.inner;
    inner.classList.toggle('selected', selected.includes(card));
    inner.style.outline = hintCards.includes(card) ? '2px dashed #c084fc' : '';
  });

  updateKeyLabels();
  ensureRaf();
}

// ─── Keyboard shortcuts (ported from setwithfriends) ─────────────────────────
// Vertical layout for 3-col boards, horizontal for 4-col boards.
const KB_3 = '123qweasdzxcrtyfghvbnuiojklm,.';
const KB_4 = 'qazwsxedcrfvtgbyhnujmik,ol.p;/';

function getKbLayout() {
  return getLayout().cols === 3 ? KB_3 : KB_4;
}

function updateKeyLabels() {
  const layout = getKbLayout();
  board.forEach((card, i) => {
    const sprite = sprites.get(card);
    if (!sprite) return;
    const lbl = sprite.inner.querySelector('.card-key-label');
    if (lbl) lbl.textContent = layout[i] || '';
  });
}

// ─── Interaction ─────────────────────────────────────────────────────────────

function onCardClick(card) {
  if (gameOver) return;
  hintCards = [];
  if (selected.includes(card)) {
    selected = selected.filter(c => c !== card);
    const sprite = sprites.get(card);
    if (sprite) sprite.inner.classList.remove('selected');
      return;
  }
  if (selected.length >= 3) return;
  selected.push(card);
  const sprite = sprites.get(card);
  if (sprite) sprite.inner.classList.add('selected');
  if (selected.length === 3) checkSelection();
}

function checkSelection() {
  const [a, b, c] = selected;
  const valid = isSet(a, b, c);
  for (const [, sprite] of sprites) sprite.inner.classList.remove('selected');
  if (valid) {
    score++;
    document.getElementById('score').textContent = score;
    const elapsed = startTime ? (Date.now() - startTime) : 0;
    gameHistory.push({ time: elapsed, cards: [...selected] });
    addHistoryEntry(gameHistory.length, [...selected], elapsed);
    document.getElementById('history-panel').style.display = '';
    board = board.filter(card => !selected.includes(card));
    selected = [];
    refillBoard();
    if (board.length === 0 || (!findSetOnBoard(board) && deck.length === 0)) { endGame(); return; }
    renderBoard();
    updateDeckInfo();
  } else {
    flashCards(selected, 'flash-error');
    setTimeout(() => {
      selected = [];
      for (const [, sprite] of sprites) sprite.inner.classList.remove('selected');
    }, 700);
  }
}

function flashCards(cards, cls) {
  for (const card of cards) {
    const sprite = sprites.get(card);
    if (!sprite) continue;
    sprite.inner.classList.add(cls);
    setTimeout(() => sprite.inner.classList.remove(cls), 500);
  }
}

function showHint() {
  if (gameOver) return;
  const hint = findSetOnBoard(board);
  if (!hint) return;
  hintCards = hint;
  // just update outlines without full re-render
  for (const [card, sprite] of sprites) {
    sprite.inner.style.outline = hintCards.includes(card) ? '2px dashed #c084fc' : '';
  }
}

function updateDeckInfo() {
  const setsOnBoard = countSetsOnBoard(board);
  document.getElementById('deck-info').textContent =
    `${setsOnBoard} set${setsOnBoard !== 1 ? 's' : ''} on board · ${deck.length} card${deck.length !== 1 ? 's' : ''} in deck`;
}

function countSetsOnBoard(cards) {
  let count = 0;
  for (let i = 0; i < cards.length; i++)
    for (let j = i + 1; j < cards.length; j++)
      for (let k = j + 1; k < cards.length; k++)
        if (isSet(cards[i], cards[j], cards[k])) count++;
  return count;
}

function updateTimer() {
  if (!startTime) return;
  const secs = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(secs / 60), s = secs % 60;
  document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function formatTime() {
  return startTime ? document.getElementById('timer').textContent : '0:00';
}

function endGame() {
  gameOver = true;
  clearInterval(timerInterval);
  // fly all remaining cards off-screen then hide
  const layout = getLayout();
  for (const [, sprite] of sprites) {
    sprite.leaving = true;
    sprite.el.className = 'card-sprite leaving';
    sprite.sx.to = layout.W + 100;
    sprite.so.to = 0;
  }
  ensureRaf();
  const finalMs = startTime ? (Date.now() - startTime) : 0;
  setTimeout(() => {
    document.getElementById('board-container').style.display = 'none';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-time').textContent  = formatTime();
    document.getElementById('end-screen').classList.add('show');
    // Record to leaderboard
    const activeMods = [fillOn && 'fill', morphOn && 'morph', cloneOn && 'clone', animOn && 'hue', fadeOn && 'fade'].filter(Boolean);
    lbRecord(finalMs, activeMods);
  }, 600);
}

// ─── Reset & History ─────────────────────────────────────────────────────────

function resetGame() {
  // Same deck, same board state — just reset score, timer, and history
  if (gameOver) { newGame(); return; }
  score = 0;
  gameHistory = [];
  startTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 500);
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('history-list').innerHTML = '';
  document.getElementById('history-panel').style.display = 'none';
}

function histCardSVG(card) {
  const { color, shape, shade, number } = cardTraits(card);
  const count = number + 1;
  const pathD = SHAPE_PATHS[shape];
  const grad  = `url(#grad-${color})`;

  // Landscape: symbols sit side by side in a wide viewBox (400h × 200w each)
  const sw = 200, sh = 400, gap = 24, pad = 20;
  const totalW = 3 * sw + 2 * gap + pad * 2;  // always 3-wide so shape scale is constant
  const totalH = sh + pad * 2;

  const usedW  = count * sw + (count - 1) * gap;
  const startX = (totalW - usedW) / 2;

  let symbols = '';
  for (let i = 0; i < count; i++) {
    const tx = startX + i * (sw + gap);
    const g  = `translate(${tx},${pad})`;
    if (shade === 0) {
      symbols += `<g transform="${g}"><path d="${pathD}" fill="${grad}"/></g>`;
    } else if (shade === 1) {
      symbols += `<g transform="${g}"><path d="${pathD}" fill="none" stroke="${grad}" stroke-width="22"/></g>`;
    } else {
      const clipId = `hc-${card}-${i}`;
      let stripes = '';
      for (let si = 0; si < 20; si++) stripes += `<rect x="0" y="${si*20}" width="200" height="10" fill="${grad}"/>`;
      symbols += `<g transform="${g}"><defs><clipPath id="${clipId}"><path d="${pathD}"/></clipPath></defs><g clip-path="url(#${clipId})">${stripes}</g><path d="${pathD}" fill="none" stroke="${grad}" stroke-width="22"/></g>`;
    }
  }

  // viewBox is landscape: totalW wide, totalH tall — but card CSS is landscape too so it fits
  return `<svg viewBox="0 0 ${totalW} ${totalH}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${symbols}</svg>`;
}

function addHistoryEntry(n, cards, elapsedMs) {
  const list = document.getElementById('history-list');
  const secs = Math.floor(elapsedMs / 1000);
  const m = Math.floor(secs / 60), s = secs % 60;
  const timeStr = `${m}:${s.toString().padStart(2,'0')}`;

  const entry = document.createElement('div');
  entry.className = 'history-entry';

  const num = document.createElement('span');
  num.className = 'history-num';
  num.textContent = n;

  const cardsDiv = document.createElement('div');
  cardsDiv.className = 'history-cards';

  for (const card of cards) {
    const hc = document.createElement('div');
    hc.className = 'hist-card';
    hc.innerHTML = histCardSVG(card);
    cardsDiv.appendChild(hc);
  }

  const time = document.createElement('span');
  time.className = 'history-time';
  time.textContent = timeStr;

  entry.appendChild(num);
  entry.appendChild(cardsDiv);
  entry.appendChild(time);
  list.appendChild(entry);
}

// Handle window resize — reflow card positions
window.addEventListener('resize', () => {
  if (board.length) renderBoard();
});

// ─── Shape Morph Engine ──────────────────────────────────────────────────────
// morphCurrentPaths[shapeIdx] = current 'd' string while morph is running.
// The morph loop just updates these strings + calls updateAllShapePaths().
// Cards emit inline <path data-shape="N"> so we can querySelectorAll and 
// blast every matching path in one shot — no per-sprite logic needed.

const MORPH_SHAPES = [
  { // squiggle
    start: [67.892902, 12.746785],
    segs: [

      [148.416961,333.103633,227.656196,364.073152,166.180659,381.949947],
      [104.705123,399.826742,40.058163,380.094902,22.447719,340.016124],
      [4.837275,299.937344,71.722357,219.906715,68.595939,151.924127],
      [65.469521,83.941539,46.722270,81.666663,18.982786,71.747043],

    ]
  },
  { // oval

      [97.499997,13.866648,101.500002,13.866648,105.500007,13.866648],

      [187.499999,346.557098,150.057082,384,105.500007,384],
      [101.500002,384,97.499997,384,93.499992,384],
      [48.942913,384,11.499990,346.557098,11.499990,302],
      [11.499990,233.288882,11.499990,164.577764,11.499990,95.866646],
    ]
  },
  { // diamond
    start: [100, 10],
    segs: [
      [85,41.6666667,70,73.3333333,55,105],
      [40,136.6666667,25,168.3333333,10,200],
      [25,231.6666667,40,263.3333333,55,295],
      [70,326.6666667,85,358.3333333,100,390],
      [115,358.3333333,130,326.6666667,145,295],
      [160,263.3333333,175,231.6666667,190,200],
