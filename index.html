      [130,73.3333333,115,41.6666667,100,10],
    ]
  },
];

// Live path strings — updated every rAF tick when morph is on
// Index = shape index (0=squiggle, 1=oval, 2=diamond)
const morphCurrentPaths = [null, null, null];

let morphOn         = false;
let morphHold       = 500;
let morphDuration   = 500;
let morphRaf        = null;
let morphPhase      = 'hold';
let morphPhaseStart = null;
let morphShapeIdx   = 0; // which shape we're currently on/morphing FROM

function morphEase(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

function morphBuildPath(start, segs) {
  let d = `M ${start[0]},${start[1]}`;
  for (const [x1,y1,x2,y2,ex,ey] of segs) d += ` C ${x1},${y1} ${x2},${y2} ${ex},${ey}`;
  return d + ' Z';
}

function morphLerp(a, b, t) {
  return {
    start: [a.start[0]+(b.start[0]-a.start[0])*t, a.start[1]+(b.start[1]-a.start[1])*t],
    segs: a.segs.map((sA,i) => sA.map((v,j) => v+(b.segs[i][j]-v)*t)),
  };
}

// Blast the new path string to every matching <path data-shape="N"> on the board
function updateAllShapePaths(shapeIdx, pathStr) {
  document.querySelectorAll(`[data-shape="${shapeIdx}"]`).forEach(p => p.setAttribute('d', pathStr));
  // Also update the tiny preview (shape 0 = squiggle drives the preview)
  if (shapeIdx === morphShapeIdx) {
    const prev = document.getElementById('morph-preview-path');
    if (prev) prev.setAttribute('d', pathStr);
  }
}

function morphTick(ts) {
  if (morphPhaseStart === null) morphPhaseStart = ts;
  const elapsed = ts - morphPhaseStart;

  // Each shape type is offset by 1/3 of the total cycle so they all morph
  // simultaneously but stay visually distinct from one another.
  const stepDuration = morphHold + morphDuration;
  const totalPeriod  = stepDuration * 3;
  const cycleOffset  = totalPeriod / 3;

  for (let si = 0; si < 3; si++) {
    const tShape   = (elapsed + si * cycleOffset) % totalPeriod;
    const stepIdx  = Math.floor(tShape / stepDuration);  // which transition 0,1,2
    const tStep    = tShape - stepIdx * stepDuration;    // time within this step

    const fromIdx  = stepIdx % 3;
    const toIdx    = (stepIdx + 1) % 3;
    const from     = MORPH_SHAPES[fromIdx];
    const to       = MORPH_SHAPES[toIdx];

    let pathStr;
    if (tStep < morphHold) {
      pathStr = morphBuildPath(from.start, from.segs);
    } else {
      const t  = Math.min((tStep - morphHold) / morphDuration, 1);
      const et = morphEase(t);
      pathStr  = morphBuildPath(morphLerp(from, to, et).start, morphLerp(from, to, et).segs);
    }

    morphCurrentPaths[si] = pathStr;
    document.querySelectorAll(`[data-shape="${si}"]`).forEach(p => p.setAttribute('d', pathStr));
  }

  const prev = document.getElementById('morph-preview-path');
  if (prev) prev.setAttribute('d', morphCurrentPaths[0]);

  morphRaf = requestAnimationFrame(morphTick);
}

function startMorph() {
  if (morphRaf) return;
  morphPhaseStart = null;
  morphRaf = requestAnimationFrame(morphTick);
}

function stopMorph() {
  if (morphRaf) { cancelAnimationFrame(morphRaf); morphRaf = null; }
  // Reset all shape paths to static
  morphCurrentPaths.fill(null);
  document.querySelectorAll('[data-shape]').forEach(p => {
    const si = parseInt(p.dataset.shape);
    p.setAttribute('d', SHAPE_PATHS[si]);
  });
  const prev = document.getElementById('morph-preview-path');
  if (prev) prev.setAttribute('d', morphBuildPath(MORPH_SHAPES[0].start, MORPH_SHAPES[0].segs));
  morphPhase = 'hold'; morphPhaseStart = null; morphShapeIdx = 0;
}

function onMorphToggle() {
  morphOn = document.getElementById('morph-toggle').checked;
  if (morphOn) startMorph(); else stopMorph();
}

function onMorphSpeedChange() {
  const val = parseInt(document.getElementById('sl-morph-speed').value);
  morphDuration = val;
  morphHold     = val;
  const mult = (500 / val).toFixed(1);
  document.getElementById('vl-morph-speed').textContent = mult + '×';
}

// ─── Shape Clone Engine ──────────────────────────────────────────────────────
// Each symbol SVG gets data-clone="N-I" (N = card's number trait 0/1/2,
// I = symbol index within that card). The clone loop collapses/expands symbols
// of each number type in and out of center overlap, using N * cycleOffset so
// 1-symbol, 2-symbol, and 3-symbol cards never animate in lockstep — exactly
// the same trick morph uses with si * cycleOffset per shape type.

// ─── Symbol Opacity Compositor ────────────────────────────────────────────────
// Clone and Fade both control [data-clone] opacity independently.
// Each stores its factor on the element; the compositor multiplies them.

function setCloneOpacity(el, v) {
  el._cloneOpacity = v;
  el.style.opacity = v * (el._fadeOpacity !== undefined ? el._fadeOpacity : 1);
}
function setFadeOpacity(v) {
  document.querySelectorAll('[data-clone]').forEach(el => {
    el._fadeOpacity = v;
    el.style.opacity = v * (el._cloneOpacity !== undefined ? el._cloneOpacity : 1);
  });
}

let cloneOn         = false;
let cloneHold       = 500; // ms holding at natural spread positions
let cloneTrans      = 500;  // ms for collapse / expand transition
let cloneHoldC      = 333;  // ms holding at center (all overlapping)
let cloneRaf        = null;
let clonePhaseStart = null;

function cloneEase(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

function cloneTick(ts) {
  if (clonePhaseStart === null) clonePhaseStart = ts;
  const elapsed = ts - clonePhaseStart;

  const layout = getLayout();
  // Exact centre-to-centre distance between adjacent symbols in the flex row:
  //   symbol width  = size * 0.5  where size = cardH * 0.54
  //   symbol margin = size * 0.08 on each side
  //   flex gap      = 4% of cardW (gap% on a flex container resolves to container width)
  const size = layout.cardH * 0.54;
  const symW = size * 0.5;
  const symM = size * 0.08;
  const flexGap = 0.04 * layout.cardW;
  const STEP = symW + 2 * symM + flexGap;

  // Mirror shape-clone.html's phase structure exactly:
  // Phase 0: hold at 1
  // Phase 1: 1→2: sym0 drifts LEFT to −STEP, sym1 fades in and drifts RIGHT from 0 to +STEP
  // Phase 2: hold at 2
  // Phase 3: 2→3: sym0 eases to −2·STEP (its 3-sym slot), sym1 (right) eases to +2·STEP,
  //               sym2 fades in drifting from +STEP (where sym1 was) to 0 (centre)
  // Phase 4: hold at 3
  // Phase 5: 3→1: all collapse back to 0, sym1+sym2 fade out
  //
  // Flex natural positions (before translateX): sym0=−STEP, sym1=0, sym2=+STEP
  // We use translateX to animate; positions below are the *visual* offsets we want
  // relative to the card centre, so the translateX we apply = desired − natural:
  //   sym0 natural flex = −STEP → tx0 = desired0 − (−STEP) = desired0 + STEP
  //   sym1 natural flex =  0    → tx1 = desired1
  //   sym2 natural flex = +STEP → tx2 = desired2 − STEP

  const h  = cloneHold;
  const tr = cloneTrans;
  const period      = 3 * h + 3 * tr;
  const cycleOffset = period / 3;

  for (let N = 0; N < 3; N++) {
    const tN = (elapsed + N * cycleOffset) % period;

    let a1, a2;        // opacities of sym1, sym2
    let d0, d1, d2;   // desired visual offsets from card centre

    function lerp(a, b, t) { return a + (b - a) * t; }

    // Target visual positions (offset from card centre):
    //   1 sym:  d0=0
    //   2 syms: d0=−STEP/2, d1=+STEP/2
    //   3 syms: d0=−STEP,   d2=0,  d1=+STEP
    const H = STEP / 2;

    if (tN < h) {
      a1 = 0; a2 = 0;
      d0 = 0; d1 = 0; d2 = 0;

    } else if (tN < h + tr) {
      // 1→2
      const e = cloneEase((tN - h) / tr);
      a1 = e; a2 = 0;
      d0 = lerp(0, -H, e);
      d1 = lerp(0, +H, e);
      d2 = +H;

    } else if (tN < 2*h + tr) {
      // Hold 2
      a1 = 1; a2 = 0;
      d0 = -H; d1 = +H; d2 = +H;

    } else if (tN < 2*h + 2*tr) {
      // 2→3: sym0 goes to −STEP, sym1 goes to +STEP, sym2 emerges from +H → 0
      const e = cloneEase((tN - 2*h - tr) / tr);
      a1 = 1; a2 = e;
      d0 = lerp(-H, -STEP, e);
      d1 = lerp(+H, +STEP, e);
      d2 = lerp(+H,     0, e);

    } else if (tN < 3*h + 2*tr) {
      // Hold 3
      a1 = 1; a2 = 1;
      d0 = -STEP; d1 = +STEP; d2 = 0;

    } else {
      // 3→1
      const e = cloneEase((tN - 3*h - 2*tr) / tr);
      a1 = 1 - e; a2 = 1 - e;
      d0 = lerp(-STEP, 0, e);
      d1 = lerp(+STEP, 0, e);
      d2 = lerp(0,     0, e);
    }

    // Convert desired visual offset → translateX (flex natural positions: −STEP, 0, +STEP)
    const tx0 = d0 + STEP;
    const tx1 = d1;
    const tx2 = d2 - STEP;

    const transforms = [tx0, tx1, tx2];
    const opacities  = [1,   a1,  a2];

    for (let i = 0; i < 3; i++) {
      document.querySelectorAll(`[data-clone="${N}-${i}"]`).forEach(el => {
        el.style.display   = '';
        el.style.transform = `translateX(${transforms[i]}px)`;
        setCloneOpacity(el, opacities[i]);
      });
    }
  }

  cloneRaf = requestAnimationFrame(cloneTick);
}

function startClone() {
  if (cloneRaf) return;
  // Reveal all phantom symbols (display:none in cardSVG) at opacity 0 so the
  // flex layout immediately reflects 3-symbol width before the first tick paints.
  document.querySelectorAll('[data-clone]').forEach(el => {
    const [N, i] = el.dataset.clone.split('-').map(Number);
    if (i >= N + 1) {
      el.style.display = '';
      setCloneOpacity(el, 0);
    }
  });
  clonePhaseStart = null;
  cloneRaf = requestAnimationFrame(cloneTick);
}

function stopClone() {
  if (cloneRaf) { cancelAnimationFrame(cloneRaf); cloneRaf = null; }
  // Reset all symbol transforms and re-hide phantom extras so the flex
  // layout returns to the card's natural symbol count.
  document.querySelectorAll('[data-clone]').forEach(el => {
    const [N, i] = el.dataset.clone.split('-').map(Number);
    el.style.transform = '';
    el._cloneOpacity = undefined;
    el.style.opacity = el._fadeOpacity !== undefined ? el._fadeOpacity : '';
    if (i >= N + 1) el.style.display = 'none';
  });
  clonePhaseStart = null;
}

function onCloneToggle() {
  cloneOn = document.getElementById('clone-toggle').checked;
  if (cloneOn) startClone(); else stopClone();
}

function onCloneSpeedChange() {
  const val  = parseInt(document.getElementById('sl-clone-speed').value);
  cloneHold  = val;
  cloneTrans = Math.round(val * 0.75);
  cloneHoldC = Math.round(val * 0.5);
  document.getElementById('vl-clone-speed').textContent = (1200 / val).toFixed(1) + '×';
}

// ─── Fill Animation Engine ────────────────────────────────────────────────────
// Animates the stripe fill on shade=2 cards, following the same
// infrastructure as morphTick / cloneTick and the stripe-loop sequence:
//   0.000–0.167  stripes expand  0% → 40%  (matches static SET-game density)
//   0.167–0.333  idle at 40%
//   0.333–0.500  stripes expand 40% → 100% (full solid fill)
//   0.500–0.667  idle full
//   0.667–0.833  card-bg curtain falls top → bottom, wiping back to empty
//   0.833–1.000  idle empty → loops
//
// Stripe geometry mirrors the SVG <pattern>:
//   period = 20px, stripe = 8px (top-anchored), viewBox 200×400 → 20 stripes
//   centres at cy = i*20 + 4  (i = 0..19)
//   hh=4  → 40% fill (SET density);  hh=10 → 100% fill (adjacent centres touch)

let fillOn         = false;
let fillDuration   = 3000;   // ms per full cycle
let fillRaf        = null;
let fillPhaseStart = null;

const FILL_HALF = 4;   // half-height at SET density  (8px / 2)
const FILL_FULL = 12;  // half-height at 100% fill — slightly >period/2 so rects overlap

function fillEase(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
function fillPct(t, a, b) { return Math.max(0, Math.min(1, (t - a) / (b - a))); }

function fillStripeHH(t) {
  let sc;
  if      (t < 0.167) sc = 0.5 * fillEase(fillPct(t, 0,     0.167));
  else if (t < 0.333) sc = 0.5;
  else if (t < 0.500) sc = 0.5 + 0.5 * fillEase(fillPct(t, 0.333, 0.500));
  else                sc = 1.0;
  return sc <= 0.5
    ? FILL_HALF * 2 * sc
    : FILL_HALF + (FILL_FULL - FILL_HALF) * 2 * (sc - 0.5);
}

function fillCurtainH(t) {
  if (t < 0.667) return 0;
  if (t < 0.833) return 400 * fillEase(fillPct(t, 0.667, 0.833));
  return 400;
}

// Per-shade phase offsets so each shade starts at its natural hold window:
//   shade=0 (solid)  → 7/12  ≈ 0.583  (mid solid-hold  0.500–0.667)
//   shade=1 (empty)  → 11/12 ≈ 0.917  (mid empty-hold  0.833–1.000)
//   shade=2 (stripe) → 1/4   = 0.250  (mid stripe-hold 0.167–0.333)
const SHADE_PHASE = [7/12, 11/12, 1/4];

function fillTick(ts) {
  if (fillPhaseStart === null) fillPhaseStart = ts;
  const elapsed = ts - fillPhaseStart;

  for (let si = 0; si < 3; si++) {
    for (let shade = 0; shade < 3; shade++) {
      const raw = elapsed + SHADE_PHASE[shade] * fillDuration;
      const t   = (raw % fillDuration) / fillDuration;
      const hh  = t < 0.667 ? fillStripeHH(t) : FILL_FULL;
      const cH  = fillCurtainH(t);

      document.querySelectorAll(`[data-fill-cy][data-fill-shape="${si}"][data-fill-shade="${shade}"]`).forEach(rect => {
        const cy = +rect.dataset.fillCy;
        rect.setAttribute('y',      cy - hh);
        rect.setAttribute('height', hh * 2);
      });
      document.querySelectorAll(`[data-fill-curtain][data-fill-shape="${si}"][data-fill-shade="${shade}"]`).forEach(rect => {
        rect.setAttribute('height', cH);
      });
    }
  }

  fillRaf = requestAnimationFrame(fillTick);
}

function startFill() {
  if (fillRaf) return;
  fillPhaseStart = null;
  fillRaf = requestAnimationFrame(fillTick);
}

function stopFill() {
  if (fillRaf) { cancelAnimationFrame(fillRaf); fillRaf = null; }
  fillPhaseStart = null;
  // Reset each (shape, shade) group to its correct static appearance
  const staticHH = [FILL_FULL, 0, FILL_HALF];
  const staticCH = [0, 400, 0];
  for (let si = 0; si < 3; si++) {
    for (let shade = 0; shade < 3; shade++) {
      const hh = staticHH[shade];
      const cH = staticCH[shade];
      document.querySelectorAll(`[data-fill-cy][data-fill-shape="${si}"][data-fill-shade="${shade}"]`).forEach(rect => {
        const cy = +rect.dataset.fillCy;
        rect.setAttribute('y',      cy - hh);
        rect.setAttribute('height', hh * 2);
      });
      document.querySelectorAll(`[data-fill-curtain][data-fill-shape="${si}"][data-fill-shade="${shade}"]`).forEach(rect => {
        rect.setAttribute('height', cH);
      });
    }
  }
}

function onFillToggle() {
  fillOn = document.getElementById('fill-toggle').checked;
  if (fillOn) startFill(); else stopFill();
}

function onFillSpeedChange() {
  const val    = parseInt(document.getElementById('sl-fill-speed').value);
  fillDuration = val;
  document.getElementById('vl-fill-speed').textContent = (3000 / val).toFixed(1) + '×';
}

// ─── Card Fade Engine ─────────────────────────────────────────────────────────
// Pulses the opacity of all symbol SVGs (data-clone) between 1 and 0
// on a 2-second sine cycle, making shapes fade into the card background.

let fadeOn    = false;
let fadeRaf   = null;
let fadeStart = null;

function fadeTick(ts) {
  if (fadeStart === null) fadeStart = ts;
  const t = ((ts - fadeStart) % 2000) / 2000; // 0..1 over 2 seconds
  const opacity = (1 + Math.cos(t * Math.PI * 2)) / 2; // 1→0→1 cosine
  setFadeOpacity(opacity);
  fadeRaf = requestAnimationFrame(fadeTick);
}

function startFade() {
  if (fadeRaf) return;
  fadeStart = null;
  fadeRaf = requestAnimationFrame(fadeTick);
}

function stopFade() {
  if (fadeRaf) { cancelAnimationFrame(fadeRaf); fadeRaf = null; }
  fadeStart = null;
  setFadeOpacity(1);
}

function onFadeToggle() {
  fadeOn = document.getElementById('fade-toggle').checked;
  if (fadeOn) startFade(); else stopFade();
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
// ─── Firebase + Leaderboard ───────────────────────────────────────────────────

const ARCANA_KEYS = ['fill', 'morph', 'clone', 'hue', 'fade'];
const ARCANA_LABELS = { fill: 'XIX', morph: 'XVIII', clone: 'XVII', hue: 'XXI', fade: '0' };
const ARCANA_NAMES = { fill: 'Shade', morph: 'Morph', clone: 'Clone', hue: 'Tint', fade: 'Fade' };

// ── Firebase init ──────────────────────────────────────────────────────────────
let firebaseReady = false;
let db = null;
let currentUserId = null;
let currentUser = null; // full Firebase user object
let _pendingScore = null;

// Display name: stored in localStorage, synced to Firebase scores
function getDisplayName() {
  return localStorage.getItem('setgame_display_name') || '';
}
function setDisplayName(name) {
  if (name) localStorage.setItem('setgame_display_name', name);
  else localStorage.removeItem('setgame_display_name');
  updateHeaderNamePill();
}

function updateHeaderNamePill() {
  const pill = document.getElementById('header-name-pill');
  if (!pill) return;
  const name = getDisplayName();
  const isLinked = currentUser && !currentUser.isAnonymous;
  pill.textContent = name || (isLinked ? currentUser.email.split('@')[0] : 'anon');
  pill.classList.toggle('linked', isLinked);
}

// ── Toast notifications ──────────────────────────────────────────────────────
function showToast(msg, type = '', duration = 3500) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' toast-' + type : '');
  el.textContent = msg;
  container.appendChild(el);
  // Trigger transition
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, duration);
}

(function initFirebase() {
  if (!FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === 'PASTE_YOUR_API_KEY') {
    console.warn('[SET] Firebase config not set — using localStorage fallback.');
    updateHeaderNamePill();
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Listen to auth state — handles anonymous, linked, and Google sign-in
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        currentUserId = user.uid;
        firebaseReady = true;
        showToast('Firebase ready (anon)', 'info', 2500);
        // Auto-populate display name from Google account if not set manually
        if (!getDisplayName() && user.displayName) {
          setDisplayName(user.displayName);
        }
        updateHeaderNamePill();
        if (document.getElementById('panel-leaderboard').classList.contains('active')) {
          renderLeaderboard();
        }
        if (document.getElementById('profile-modal-overlay').classList.contains('open')) {
          renderProfileModal();
        }
        if (_pendingScore) {
          const e = _pendingScore; _pendingScore = null;
          const payload = { ...e, uid: currentUserId, history: JSON.stringify(e.history), initialDeck: JSON.stringify(e.initialDeck), mods: JSON.stringify(e.mods) };
          showToast('Saving score…');
          db.ref('scores').push(payload)
            .then(() => showToast('Score saved ✓', 'success'))
            .catch(err => {
              console.error('[SET] Failed to save pending score:', err);
              showToast('SAVE FAILED: ' + (err.code || err.message), 'error', 5000);
            });
        }
      } else {
        // Sign in anonymously if no user yet
        firebase.auth().signInAnonymously().catch(err => {
          console.error('[SET] Firebase anon auth failed:', err);
          showToast('No Firebase', 'error', 5000);
        });
      }
    });
  } catch (err) {
    console.error('[SET] Firebase init failed:', err);
    showToast('No Firebase', 'error', 5000);
    updateHeaderNamePill();
  }
})();

// ── localStorage fallback helpers ─────────────────────────────────────────────
function lbGetLocal() {
  try { return JSON.parse(localStorage.getItem('setgame_lb') || '[]'); } catch { return []; }
}
function lbSaveLocal(arr) {
  try { localStorage.setItem('setgame_lb', JSON.stringify(arr)); } catch {}
}

// ── Record a finished game ─────────────────────────────────────────────────────
function lbRecord(timeMs, mods) {
  const entry = {
    t: timeMs,
    mods,
    d: Date.now(),
    name: getDisplayName() || null,
    history: gameHistory.map(h => ({ time: h.time, cards: [...h.cards] })),
    initialDeck: [...initialDeck],
  };

  if (db) {
    const write = (e) => {
      const payload = { ...e, uid: currentUserId, history: JSON.stringify(e.history), initialDeck: JSON.stringify(e.initialDeck), mods: JSON.stringify(e.mods) };
      showToast('Saving score…');
      db.ref('scores').push(payload)
        .then(() => {
          showToast('Score saved ✓', 'success');
          if (document.getElementById('panel-leaderboard').classList.contains('active')) renderLeaderboard();
        })
        .catch(err => {
          console.error('[SET] Failed to save score:', err);
          showToast('SAVE FAILED: ' + (err.code || err.message), 'error', 5000);
        });
    };
    if (firebaseReady) { write(entry); } else { _pendingScore = entry; }
  } else {
    const entries = lbGetLocal();
    entries.push(entry);
    lbSaveLocal(entries);
  }
}

// ── filter state: set of arcana keys ──────────────────────────────────────────
const lbFilter = new Set();

function switchTab(tab) {
  if (tab === 'leaderboard') switchPanel('leaderboard');
}

function buildLbFilterCards() {
  const el = document.getElementById('lb-filter-cards');
  if (el.children.length > 0) return; // already built
  ARCANA_KEYS.forEach(key => {
    const card = document.createElement('div');
    card.className = 'lb-mini-card' + (lbFilter.has(key) ? ' active' : '');
    card.id = 'lbf-' + key;
    card.title = ARCANA_NAMES[key] || key;
    const srcSvg = document.querySelector('#arc-' + key + ' .arcana-art svg');
    if (srcSvg) {
      const clone = srcSvg.cloneNode(true);
      clone.setAttribute('width', '28');
      clone.setAttribute('height', '44');
      clone.style.display = 'block';
      clone.style.pointerEvents = 'none';
      card.appendChild(clone);
    }
    card.onclick = () => {
      lbFilter.has(key) ? lbFilter.delete(key) : lbFilter.add(key);
      const isActive = lbFilter.has(key);
      card.classList.toggle('active', isActive);
      renderLeaderboard();
    };
    el.appendChild(card);
  });
}

function renderLbEntries(entries) {
  const list = document.getElementById('lb-list');
  list.innerHTML = '';

  // filter — empty = vanilla only, mods selected = must include ALL selected mods
  let filtered;
  if (lbFilter.size === 0) {
    filtered = entries.filter(e => !e.mods || e.mods.length === 0);
  } else {
    filtered = entries.filter(e => [...lbFilter].every(k => (e.mods||[]).includes(k)));
  }
  filtered.sort((a, b) => a.t - b.t);

  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'lb-empty';
    empty.textContent = lbFilter.size ? 'no runs with these modifiers' : 'no vanilla runs yet';
    list.appendChild(empty);
    return;
  }

  filtered.forEach((e, i) => {
    const hasReplay = !!(e.history && e.initialDeck);
    const row = document.createElement('div');
    row.className = 'lb-entry';
    if (hasReplay) {
      row.title = 'Click to watch replay';
      row.addEventListener('click', ev => {
        if (ev.target.closest('.lb-name-link')) return;
        openReplay(e);
      });
    } else {
      row.style.cursor = 'default';
    }

    const rank = document.createElement('div');
    rank.className = 'lb-rank' + (i === 0 ? ' gold' : i === 1 ? ' silver' : i === 2 ? ' bronze' : '');
    rank.textContent = i + 1;

    const modsEl = document.createElement('div');
    modsEl.className = 'lb-mods';
    if (e.mods.length === 0) {
      const none = document.createElement('span');
      none.className = 'lb-no-mods';
      none.textContent = 'no modifiers';
      modsEl.appendChild(none);
    } else {
      e.mods.forEach(k => {
        const pip = document.createElement('div');
        pip.className = 'lb-mod-pip';
        const arcArt = document.querySelector('#arc-' + k + ' .arcana-art');
        if (arcArt) {
          const svgEl = arcArt.querySelector('svg');
          if (svgEl) {
            const clone = svgEl.cloneNode(true);
            clone.setAttribute('width', '16');
            clone.setAttribute('height', '16');
            clone.style.display = 'block';
            pip.appendChild(clone);
          } else {
            pip.innerHTML = MINI_ART[k] || '';
          }
        } else {
          pip.innerHTML = MINI_ART[k] || '';
        }
        modsEl.appendChild(pip);
      });
    }

    const secs = Math.floor(e.t / 1000);
    const m = Math.floor(secs / 60), s = secs % 60;
    const timeEl = document.createElement('div');
    timeEl.className = 'lb-time';
    timeEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;

    const replayHint = document.createElement('div');
    replayHint.style.cssText = 'font-size:10px;flex-shrink:0;color:var(--text-muted);opacity:' + (hasReplay ? '0.45' : '0') + ';';
    replayHint.textContent = '▶';

    row.appendChild(rank);
    row.appendChild(modsEl);

    if (e.name) {
      const nameEl = document.createElement('div');
      nameEl.className = 'lb-name lb-name-link';
      nameEl.textContent = e.name;
      nameEl.title = "View " + e.name + "'s profile";
      nameEl.style.cssText = 'cursor:pointer;transition:color 0.15s;';
      nameEl.addEventListener('mouseenter', () => nameEl.style.color = 'var(--teal)');
      nameEl.addEventListener('mouseleave', () => nameEl.style.color = '');
      nameEl.addEventListener('click', ev => { ev.stopPropagation(); openPlayerProfile(e.name); });
      row.appendChild(nameEl);
    }

    if (e.uid && e.uid === currentUserId) {
      const you = document.createElement('div');
      you.style.cssText = 'font-size:9px;letter-spacing:1px;color:var(--teal);flex-shrink:0;';
      you.textContent = 'you';
      row.appendChild(timeEl);
      row.appendChild(you);
    } else {
      row.appendChild(timeEl);
    }

    row.appendChild(replayHint);
    list.appendChild(row);
  });
}

function renderLeaderboard() {
  const list = document.getElementById('lb-list');

  if (firebaseReady && db) {
    list.innerHTML = '<div class="lb-empty">loading…</div>';
    // Fetch top 100 scores ordered by time
    db.ref('scores').orderByChild('t').limitToFirst(100).once('value')
      .then(snap => {
        const entries = [];
        snap.forEach(child => {
          const raw = child.val();
          // Deserialise JSON strings back to arrays
          entries.push({
            ...raw,
            mods:        tryParseJson(raw.mods, []),
            history:     tryParseJson(raw.history, null),
            initialDeck: tryParseJson(raw.initialDeck, null),
          });
        });
        renderLbEntries(entries);
      })
      .catch(err => {
        console.error('[SET] Failed to load scores:', err);
        list.innerHTML = '<div class="lb-empty">failed to load — check console</div>';
      });
  } else {
    // Fallback: localStorage
    renderLbEntries(lbGetLocal());
  }
}

function tryParseJson(val, fallback) {
  if (val === null || val === undefined) return fallback;
  if (typeof val !== 'string') return val; // already parsed
  try { return JSON.parse(val); } catch { return fallback; }
}


// ─── Replay Engine ────────────────────────────────────────────────────────────

let replayEntry     = null;
let replayStepIdx   = -1;
let replayBoards    = [];
let replayPlaying   = false;
let replayTimer     = null;
let replayInterval  = 1100;

function buildReplayBoards(initialDeckArr, history) {
  let simDeck = [...initialDeckArr];
  let simBoard = [];
  const boards = [];

  function simRefill() {
    const target = Math.max(12, simBoard.length);
    while (simBoard.length < target && simDeck.length > 0) simBoard.push(simDeck.pop());
    while (!findSetOnBoard(simBoard) && simDeck.length > 0) {
      simBoard.push(simDeck.pop());
      simBoard.push(simDeck.pop());
      simBoard.push(simDeck.pop());
    }
  }

  simRefill();
  boards.push({ board: [...simBoard], foundCards: null, deckLeft: simDeck.length });

  for (const h of history) {
    const [a, b, c] = h.cards;
    simBoard = simBoard.filter(card => card !== a && card !== b && card !== c);
    simRefill();
    boards.push({ board: [...simBoard], foundCards: [a, b, c], time: h.time, deckLeft: simDeck.length });
  }

  return boards;
}

function renderReplayBoard(boardArr, highlightCards) {
  const container = document.getElementById('replay-board-inner');
  const boardEl   = document.getElementById('replay-board');
  boardEl.innerHTML = '';

  const W = Math.min(container.clientWidth || 660, 720);
  const cols = W < 480 ? 3 : 4;
  const cardW = Math.floor((W - GAP * (cols + 1)) / cols);
  const cardH = Math.round(cardW / 1.6);
  const rows  = Math.ceil(boardArr.length / cols);
  const h     = rows * cardH + (rows + 1) * GAP;

  container.style.height = h + 'px';
  boardEl.style.height   = h + 'px';

  boardArr.forEach((card, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x   = GAP + col * (cardW + GAP);
    const y   = GAP + row * (cardH + GAP);

    const sprite = document.createElement('div');
    sprite.style.cssText = `position:absolute;width:${cardW}px;height:${cardH}px;transform:translate(${x}px,${y}px);`;

    const inner = document.createElement('div');
    inner.className = 'set-card';
    inner.style.pointerEvents = 'none';
    inner.innerHTML = cardSVG(card, cardH * 0.54);

    if (highlightCards && highlightCards.includes(card)) {
      inner.style.boxShadow = '0 0 0 3px var(--success), 0 0 16px rgba(74,222,128,0.3)';
    }

    sprite.appendChild(inner);
    boardEl.appendChild(sprite);
  });
}

function replayRenderStep() {
  if (!replayEntry || replayBoards.length === 0) return;

  const idx   = replayStepIdx;
  const total = replayBoards.length - 1;
  const state = replayBoards[Math.max(0, idx + 1)];
  const highlight = idx >= 0 && replayBoards[idx + 1]?.foundCards;
  renderReplayBoard(state.board, highlight || null);

  const setNum = Math.max(0, idx + 1);
  document.getElementById('replay-progress').textContent = `Set ${setNum} / ${total}`;
  document.getElementById('replay-scrubber').value = setNum;

  const infoEl = document.getElementById('replay-step-info');
  infoEl.innerHTML = '';
  if (idx >= 0 && replayBoards[idx + 1]?.foundCards) {
    const s = replayBoards[idx + 1];
    const row = document.createElement('div');
    row.className = 'replay-set-found';
    const label = document.createElement('span');
    label.textContent = `Set #${idx + 1}`;
    row.appendChild(label);
    for (const card of s.foundCards) {
      const hc = document.createElement('div');
      hc.className = 'hist-card';
      hc.innerHTML = histCardSVG(card);
      row.appendChild(hc);
    }
    if (s.time !== undefined) {
      const secs = Math.floor(s.time / 1000);
      const m2 = Math.floor(secs / 60), sec2 = secs % 60;
      const t = document.createElement('span');
      t.style.marginLeft = 'auto';
      t.textContent = `@ ${m2}:${sec2.toString().padStart(2,'0')}`;
      row.appendChild(t);
    }
    infoEl.appendChild(row);
  } else if (idx === -1) {
    const row = document.createElement('div');
    row.className = 'replay-set-found';
    row.style.borderColor = 'var(--border)';
    row.style.background  = 'transparent';
    row.textContent = 'Initial board state';
    infoEl.appendChild(row);
  }

  const statEl = document.getElementById('replay-stat-row');
  statEl.innerHTML = `Sets found: <span>${Math.max(0, idx + 1)}</span> &nbsp; Cards in deck: <span>${state.deckLeft}</span> &nbsp; Cards on board: <span>${state.board.length}</span>`;

  document.getElementById('replay-btn-prev').disabled = idx <= -1;
  document.getElementById('replay-btn-next').disabled = idx >= total - 1;
}

function replayStep(dir) {
  if (!replayEntry) return;
  const total = replayBoards.length - 1;
  replayStepIdx = Math.max(-1, Math.min(total - 1, replayStepIdx + dir));
  replayRenderStep();
}

function replayScrub(val) {
  replayStepIdx = parseInt(val) - 1;
  replayRenderStep();
}

function replayTogglePlay() {
  replayPlaying = !replayPlaying;
  const btn = document.getElementById('replay-btn-play');
  btn.textContent = replayPlaying ? '⏸ Pause' : '▶ Play';
  btn.classList.toggle('active', replayPlaying);
  if (replayPlaying) replayAutoPlay();
  else { clearTimeout(replayTimer); replayTimer = null; }
}

function replayAutoPlay() {
  if (!replayPlaying) return;
  const total = replayBoards.length - 1;
  if (replayStepIdx >= total - 1) {
    replayPlaying = false;
    document.getElementById('replay-btn-play').textContent = '▶ Play';
    document.getElementById('replay-btn-play').classList.remove('active');
    return;
  }
  replayStep(1);
  replayTimer = setTimeout(replayAutoPlay, replayInterval);
}

function replayUpdateSpeed() {
  const val = parseInt(document.getElementById('replay-speed').value);
  replayInterval = val;
  const mult = (1100 / val).toFixed(1);
  document.getElementById('replay-speed-label').textContent = mult + '×';
}

function openReplay(entry) {
  replayEntry   = entry;
  replayBoards  = buildReplayBoards(entry.initialDeck, entry.history);
  replayStepIdx = -1;

  replayPlaying = false;
  clearTimeout(replayTimer);
  document.getElementById('replay-btn-play').textContent = '▶ Play';
  document.getElementById('replay-btn-play').classList.remove('active');

  const total = replayBoards.length - 1;
  const scrubber = document.getElementById('replay-scrubber');
  scrubber.max   = total;
  scrubber.value = 0;

  const secs = Math.floor(entry.t / 1000);
  const m = Math.floor(secs / 60), s = secs % 60;
  document.getElementById('replay-meta-time').textContent = `${m}:${s.toString().padStart(2,'0')} · ${total} sets`;

  const modsEl = document.getElementById('replay-meta-mods');
  modsEl.innerHTML = '';
  if (entry.mods && entry.mods.length > 0) {
    entry.mods.forEach(k => {
      const pip = document.createElement('div');
      pip.className = 'lb-mod-pip';
      pip.innerHTML = MINI_ART_REPLAY[k] || '';
      modsEl.appendChild(pip);
    });
  }

  // Apply modifiers visually (toggle the arcana indicators)
  ARCANA_KEYS.forEach(k => {
    arcanaSelected[k] = entry.mods.includes(k);
  });

  document.getElementById('replay-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  replayRenderStep();
}

function closeReplay() {
  replayPlaying = false;
  clearTimeout(replayTimer);
  replayEntry = null;
  document.getElementById('replay-overlay').classList.add('hidden');
  document.body.style.overflow = '';
  document.getElementById('replay-board').innerHTML = '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('replay-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('replay-overlay')) closeReplay();
  });
});

document.addEventListener('keydown', e => {
  if (document.getElementById('replay-overlay').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') replayStep(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   replayStep(-1);
  if (e.key === ' ') { e.preventDefault(); replayTogglePlay(); }
  if (e.key === 'Escape') closeReplay();
});

    document.getElementById('arc-' + k).classList.remove('selected');

  const overlay = document.getElementById('arcana-screen');

function animateArcanaCards() {
  const cards = Array.from(document.querySelectorAll('.arcana-card'));
  const STAGGER = 55; // ms between each card

  // Spring constants matching the board animation
  const T = TENSION, F = FRICTION, M = MASS;

  cards.forEach((card, i) => {
    // Reset: start off-screen left, invisible
    card.style.transition = 'none';
    card.style.transform = 'translateX(-320px)';
    card.style.opacity = '0';

    setTimeout(() => {
      card.style.transition = 'transform 0.55s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.3s ease';
      card.style.transform = 'translateX(0px)';
      card.style.opacity = '1';
      // After animation settles, clear inline styles so CSS class transforms work
      setTimeout(() => {
        card.style.transition = '';
        card.style.transform = '';
        card.style.opacity = '';
      }, 600);
    }, i * STAGGER);
  });
}

function toggleArcana(key) {
  arcanaSelected[key] = !arcanaSelected[key];

  card.classList.toggle('selected', arcanaSelected[key]);

    card.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.15s, opacity 0.15s';
    card.style.transform = 'translateY(-4px) scale(1.03)';
  } else {
    card.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s, opacity 0.15s';
    card.style.transform = '';
  }
}

// ── Player Search ──────────────────────────────────────────────────────────────

let playerChartInstance = null;
let playerAllEntries = [];
let playerFilterMods = new Set(); // arcana keys to require (empty = no mod filter)

function renderAllPlayers() {
  const area = document.getElementById('player-results-area');
  area.innerHTML = '<div class="player-empty">loading…</div>';
  const build = (entries) => {
    const map = new Map();
    entries.forEach(e => {
      const n = (e.name||'').trim(); if (!n) return;
      if (!map.has(n)) map.set(n, {name:n, best:Infinity, runs:0});
      const p = map.get(n); p.runs++;
      const t = typeof e.t === 'number' ? e.t : Infinity;
      if (t < p.best) p.best = t;
    });
    if (!map.size) { area.innerHTML = '<div class="player-empty">no players yet</div>'; return; }
    const players = [...map.values()].sort((a,b) => a.name.localeCompare(b.name));
    area.innerHTML = '';
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);width:100%;margin-bottom:4px;';
    lbl.textContent = 'all players (' + players.length + ')';
    area.appendChild(lbl);
    const list = document.createElement('div');
    list.style.cssText = 'width:100%;display:flex;flex-direction:column;gap:6px;';
    players.forEach(p => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:background 0.15s,border-color 0.15s;';
      row.onmouseenter = () => { row.style.background='#222'; row.style.borderColor='var(--teal)'; };
      row.onmouseleave = () => { row.style.background='var(--surface)'; row.style.borderColor='var(--border)'; };
      row.onclick = () => { document.getElementById('player-search-input').value = p.name; playerSearch(); };
      const nm = document.createElement('div');
      nm.style.cssText = 'flex:1;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      nm.textContent = p.name;
      const rc = document.createElement('div');
      rc.style.cssText = 'font-size:10px;color:var(--text-muted);flex-shrink:0;';
      rc.textContent = p.runs + (p.runs===1?' run':' runs');
      const bt = document.createElement('div');
      bt.style.cssText = 'font-size:13px;color:var(--teal);font-variant-numeric:tabular-nums;flex-shrink:0;';
      if (p.best < Infinity) { const s=Math.floor(p.best/1000),m=Math.floor(s/60); bt.textContent=m+':'+String(s%60).padStart(2,'0'); }
      row.appendChild(nm); row.appendChild(rc); row.appendChild(bt);
      list.appendChild(row);
    });
    area.appendChild(list);
  };
  if (firebaseReady && db) {
    db.ref('scores').once('value').then(snap => { const e=[]; snap.forEach(c=>e.push(c.val())); build(e); }).catch(()=>{ area.innerHTML='<div class="player-empty">error loading</div>'; });
  } else { build(lbGetLocal()); }
}

function playerSearch() {
  const query = document.getElementById('player-search-input').value.trim().toLowerCase();
  const area = document.getElementById('player-results-area');
  if (!query) { renderAllPlayers(); return; }
  area.innerHTML = '<div class="player-empty">searching…</div>';

  if (firebaseReady && db) {
    db.ref('scores').orderByChild('t').once('value')
      .then(snap => {
        const all = [];
        snap.forEach(child => {
          const raw = child.val();
          const name = (raw.name || '').toLowerCase();
          if (name && name.toLowerCase().includes(query)) {
            all.push({
              ...raw,
              mods:        tryParseJson(raw.mods, []),
              history:     tryParseJson(raw.history, null),
              initialDeck: tryParseJson(raw.initialDeck, null),
            });
          }
        });
        playerAllEntries = all;
        playerFilterMods = new Set();
        renderPlayerResults(all, query);
      })
      .catch(err => {
        area.innerHTML = '<div class="player-empty">error loading — check console</div>';
        console.error(err);
      });
  } else {
    const all = lbGetLocal().filter(e => (e.name || '').toLowerCase().includes(query));
    playerAllEntries = all;
    playerFilterMods = new Set();
    renderPlayerResults(all, query);
  }
}

function renderPlayerResults(all, query) {
  const area = document.getElementById('player-results-area');
  area.innerHTML = '';

  if (all.length === 0) {
    area.innerHTML = `<div class="player-empty">no player found matching "${query}"</div>`;
    return;
  }

  // Best display name from results
  const displayName = all.find(e => e.name)?.name || query;

  function fmtMs(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  }

  // Header
  const header = document.createElement('div');
  header.className = 'player-stats-header';
  header.innerHTML = `<div class="player-name-display">${displayName}</div>`;
  area.appendChild(header);
  window._currentPlayerName = displayName;

  // Stat cards (values filled in by renderPlayerChart on first call)
  const grid = document.createElement('div');
  grid.className = 'player-stat-grid';
  grid.innerHTML = `
    <div class="player-stat-card">
      <div class="player-stat-card-label">Runs</div>
      <div class="player-stat-card-value" id="pstat-runs">—</div>
    </div>
    <div class="player-stat-card">
      <div class="player-stat-card-label">Best Time</div>
      <div class="player-stat-card-value" id="pstat-best">—</div>
    </div>
    <div class="player-stat-card">
      <div class="player-stat-card-label">Avg Time</div>
      <div class="player-stat-card-value" id="pstat-avg">—</div>
    </div>
  `;
  area.appendChild(grid);

  // Chart section
  const chartSection = document.createElement('div');
  chartSection.className = 'player-chart-section';

  const chartLabelRow = document.createElement('div');
  chartLabelRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;';
  chartLabelRow.innerHTML = `<div class="player-chart-label" id="chart-context-label">Improvement · vanilla</div>`;

  const filterRow = document.createElement('div');
  filterRow.className = 'player-chart-filters';

  const filterLabel = document.createElement('div');
  filterLabel.className = 'player-chart-filter-label';
  filterLabel.textContent = 'filter';
  filterRow.appendChild(filterLabel);

  // Build arcana mini cards for filter
  const ART = {
    fill:  document.querySelector('#arc-fill .arcana-art').innerHTML,
    morph: document.querySelector('#arc-morph .arcana-art').innerHTML,
    clone: document.querySelector('#arc-clone .arcana-art').innerHTML,
    hue:   document.querySelector('#arc-hue .arcana-art').innerHTML,
    fade:  document.querySelector('#arc-fade .arcana-art').innerHTML,
  };

  ARCANA_KEYS.forEach(key => {
    const card = document.createElement('div');
    card.className = 'lb-mini-card';
    card.id = 'plf-' + key;
    card.style.cssText = 'width:32px;height:52px;';
    card.innerHTML = `<div style="transform:scale(0.3);transform-origin:center;pointer-events:none;">${ART[key]}</div>`;
    card.title = ARCANA_NAMES[key] || key;
    card.onclick = () => {
      if (playerFilterMods.has(key)) playerFilterMods.delete(key);
      else playerFilterMods.add(key);
      card.classList.toggle('active', playerFilterMods.has(key));
      const lbl = document.getElementById('chart-context-label');
      if (lbl) lbl.textContent = playerFilterMods.size === 0 ? 'Improvement · vanilla' : `Improvement · ${[...playerFilterMods].map(k => ARCANA_NAMES[k] || k).join(' + ')}`;
      renderPlayerChart(playerAllEntries);
    };
    filterRow.appendChild(card);
  });

  chartLabelRow.appendChild(filterRow);
  chartSection.appendChild(chartLabelRow);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'player-chart-wrap';
  const canvas = document.createElement('canvas');
  canvas.id = 'player-chart-canvas';
  canvas.height = 220;
  chartWrap.appendChild(canvas);
  chartSection.appendChild(chartWrap);
  area.appendChild(chartSection);

  // Recent runs section
  const recentSection = document.createElement('div');
  recentSection.className = 'player-recent-section';
  const recentLabel = document.createElement('div');
  recentLabel.className = 'player-chart-label';
  recentLabel.textContent = 'Recent Runs';
  recentSection.appendChild(recentLabel);

  const recentList = document.createElement('div');
  recentList.className = 'lb-list';
  const sorted = [...all].sort((a, b) => b.d - a.d).slice(0, 10);
  sorted.forEach(e => {
    const hasReplay = !!(e.history && e.initialDeck);
    const row = document.createElement('div');
    row.className = 'lb-entry';
    if (hasReplay) {
      row.title = 'Click to watch replay';
      row.addEventListener('click', () => openReplay(e));
    } else {
      row.style.cursor = 'default';
      row.title = 'No replay data';
    }

    const dateEl = document.createElement('div');
    dateEl.style.cssText = 'font-size:9px;color:var(--text-muted);flex-shrink:0;letter-spacing:0.5px;';
    const d = new Date(e.d);
    dateEl.textContent = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

    const modsEl = document.createElement('div');
    modsEl.className = 'lb-mods';
    if (!e.mods || e.mods.length === 0) {
      const none = document.createElement('span');
      none.className = 'lb-no-mods';
      none.textContent = 'vanilla';
      modsEl.appendChild(none);
    } else {
      e.mods.forEach(k => {
        const pip = document.createElement('div');
        pip.className = 'lb-mod-pip';
        pip.innerHTML = MINI_ART[k] || '';
        modsEl.appendChild(pip);
      });
    }

    const timeEl = document.createElement('div');
    timeEl.className = 'lb-time';
    timeEl.textContent = fmtMs(e.t);

    const replayHint = document.createElement('div');
    replayHint.style.cssText = 'font-size:10px;flex-shrink:0;color:var(--text-muted);opacity:' + (hasReplay ? '0.45' : '0') + ';margin-left:auto;';
    replayHint.textContent = '▶';

    row.appendChild(dateEl);
    row.appendChild(modsEl);
    row.appendChild(timeEl);
    row.appendChild(replayHint);
    recentList.appendChild(row);
  });
  recentSection.appendChild(recentList);
  area.appendChild(recentSection);

  // Draw chart
  renderPlayerChart(all);
}



function _buildImprovChartConfig(sorted) {
  const accent = '#2dd4bf';   // teal PB line
  const dotColor = 'rgba(240,237,232,0.28)';
  const mutedCol = '#7a766f';
  const bgCol = '#0f0e0d';
  const borderCol = '#2e2c29';
  const textCol = '#f0ede8';
  const gridCol = 'rgba(46,44,41,.8)';

  if (sorted.length === 0) return null;

  const points = sorted.map((e, idx) => ({ x: e.d, y: e.t / 1000, _idx: idx }));

  // PB step-line: only record new PBs as step points (like jstris)
  let pb = Infinity;
  const pbPoints = [];
  sorted.forEach(e => {
    const secs = e.t / 1000;
    if (secs < pb) {
      pb = secs;
      pbPoints.push({ x: e.d, y: pb });
    }
  });
  // Extend to now
  if (pbPoints.length) pbPoints.push({ x: Date.now(), y: pb });

  const ptRadius = 2.5;
  const ptHover  = 5;

  return {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'All runs',
          data: points,
          pointRadius: ptRadius,
          pointHoverRadius: ptHover,
          pointHoverBackgroundColor: accent,
          backgroundColor: dotColor,
          borderColor: 'transparent',
          showLine: false,
          order: 2,
        },
        {
          label: 'Personal best',
          data: pbPoints,
          type: 'line',
          pointRadius: 0,
          pointHoverRadius: 0,
          borderColor: accent,
          borderWidth: 2,
          fill: false,
          tension: 0,
          stepped: 'after',
          order: 1,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 200 },
      onClick: (event, elements) => {
        const hits = elements.filter(el => el.datasetIndex === 0);
        if (!hits.length) return;
        const entry = playerChartEntries[hits[0].index];
        if (!entry) return;
        if (entry.history && entry.initialDeck) {
          openReplay(entry);
        } else {
          const cv = document.getElementById('player-chart-canvas');
          if (cv) { cv.style.outline = '2px solid var(--error)'; setTimeout(() => cv.style.outline = '', 600); }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: bgCol,
          borderColor: borderCol,
          borderWidth: 1,
          titleColor: mutedCol,
          bodyColor: textCol,
          padding: 10,
          titleFont: { family: 'DM Mono, monospace', size: 10 },
          bodyFont: { family: 'DM Mono, monospace', size: 11 },
          filter: item => item.datasetIndex === 0,
          callbacks: {
            title: items => {
              const d = new Date(items[0].raw.x);
              return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            },
            label: item => {
              if (item.datasetIndex !== 0) return null;
              const s = item.raw.y;
              const m = Math.floor(s/60), sec = (s%60).toFixed(3);
              const entry = playerChartEntries[item.dataIndex];
              const hasReplay = !!(entry && entry.history && entry.initialDeck);
              return `${m}:${sec.toString().padStart(6,'0')}` + (hasReplay ? '  ▶ click to replay' : '');
            }
          },
        }
      },
      scales: {
        x: {
          type: 'linear',
          ticks: {
            color: mutedCol,
            font: { family: 'DM Mono, monospace', size: 10 },
            maxTicksLimit: 7,
            callback: val => {
              const d = new Date(val);
              return `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(2)}`;
            }
          },
          grid: { color: gridCol },
          border: { color: borderCol },
        },
        y: {
          reverse: false,
          ticks: {
            color: mutedCol,
            font: { family: 'DM Mono, monospace', size: 10 },
            callback: val => {
              const m = Math.floor(val/60), s = Math.floor(val%60);
              return `${m}:${s.toString().padStart(2,'0')}`;
            }
          },
          grid: { color: gridCol },
          border: { color: borderCol },
        }
      }
    }
  };
}

function renderPlayerChart(all) {
  // No mods selected = vanilla only. Mods selected = must include ALL selected mods.
  let filtered;
  if (playerFilterMods.size === 0) {
    filtered = all.filter(e => !e.mods || e.mods.length === 0);
  } else {
    filtered = all.filter(e => [...playerFilterMods].every(k => (e.mods||[]).includes(k)));
  }

  // Update stat cards to reflect the current filter
  const runsEl = document.getElementById('pstat-runs');
  const bestEl = document.getElementById('pstat-best');
  const avgEl  = document.getElementById('pstat-avg');
  if (runsEl) runsEl.textContent = filtered.length;
  if (filtered.length > 0) {
    const fmtMs = ms => { const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; };
    if (bestEl) bestEl.textContent = fmtMs(Math.min(...filtered.map(e => e.t)));
    if (avgEl)  avgEl.textContent  = fmtMs(Math.round(filtered.reduce((s,e) => s + e.t, 0) / filtered.length));
  } else {
    if (bestEl) bestEl.textContent = '—';
    if (avgEl)  avgEl.textContent  = '—';
  }

  const sorted = [...filtered].sort((a, b) => a.d - b.d);
  playerChartEntries = sorted;

  const canvas = document.getElementById('player-chart-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  if (playerChartInstance) { playerChartInstance.destroy(); playerChartInstance = null; }

  if (sorted.length === 0) {
    const W = canvas.parentElement.clientWidth || 520;
    canvas.width  = W;
    canvas.height = 220;
    ctx.clearRect(0, 0, W, 220);
    ctx.fillStyle = '#7a766f';
    ctx.font = '11px DM Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('no runs with selected modifiers', W/2, 110);
    return;
  }

  canvas.height = 220;
  const cfg = _buildImprovChartConfig(sorted);
  if (!cfg) return;
  playerChartInstance = new Chart(ctx, cfg);

  canvas.style.cursor = 'default';
  canvas.addEventListener('mousemove', ev => {
    const pts = playerChartInstance.getElementsAtEventForMode(ev, 'nearest', { intersect: true }, false);
    canvas.style.cursor = pts.length && pts[0].datasetIndex === 0 ? 'pointer' : 'default';
  });
}


// Allow Enter key in player search
document.getElementById('player-search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') playerSearch();
});

function openPlayerProfile(name) {
  switchPanel('player');
  const input = document.getElementById('player-search-input');
  input.value = name;
  // Small delay so the panel is visible before we search
  setTimeout(() => playerSearch(), 50);
}


function openProfileModal() {
  renderProfileModal();
  const overlay = document.getElementById('profile-modal-overlay');
  overlay.classList.add('open');
  const input = document.getElementById('profile-name-input');
  input.value = getDisplayName();
  setTimeout(() => input.focus(), 120);
}

function closeProfileModal() {
  document.getElementById('profile-modal-overlay').classList.remove('open');
  document.getElementById('profile-name-msg').textContent = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('profile-modal-overlay')) closeProfileModal();
}

function saveProfileName() {
  const input = document.getElementById('profile-name-input');
  const name = input.value.trim();
  setDisplayName(name);
  const msg = document.getElementById('profile-name-msg');
  msg.className = 'profile-success';
  msg.textContent = 'Saved!';
  setTimeout(() => { msg.textContent = ''; }, 2000);
}

function renderProfileModal() {
  const section = document.getElementById('profile-google-section');
  const isAnon = !currentUser || currentUser.isAnonymous;
  const googleSvg = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;flex-shrink:0;"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>`;

  if (isAnon) {
    section.innerHTML = `
      <div class="profile-label">Google account</div>
      <p class="profile-status">You're anonymous. Link a Google account to keep your scores across devices.</p>
      <button class="profile-google-btn" onclick="handleGoogleLink()">${googleSvg} Link Google Account</button>
      <button class="profile-google-btn" style="margin-top:6px;" onclick="handleGoogleSignIn()">${googleSvg} Sign in with Google</button>
      <div id="profile-google-msg"></div>
    `;
  } else {
    section.innerHTML = `
      <div class="profile-label">Google account</div>
      <p class="profile-status">Signed in as <strong>${currentUser.email}</strong></p>
      <button class="profile-google-btn" onclick="handleSignOut()">Sign out</button>
    `;
  }
}

function handleGoogleLink() {
  if (!firebase || !firebase.auth) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().currentUser.linkWithPopup(provider)
    .then(() => { renderProfileModal(); updateHeaderNamePill(); })
    .catch(err => {
      if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') return;
      const msg = document.getElementById('profile-google-msg');
      if (!msg) return;
      msg.className = 'profile-error';
      msg.textContent = err.code === 'auth/credential-already-in-use'
        ? 'That Google account is already linked to a different user.'
        : err.message;
    });
}

function handleGoogleSignIn() {
  if (!firebase || !firebase.auth) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider)
    .then(() => { renderProfileModal(); updateHeaderNamePill(); closeProfileModal(); })
    .catch(err => {
      if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') return;
      const msg = document.getElementById('profile-google-msg');
      if (msg) { msg.className = 'profile-error'; msg.textContent = err.message; }
    });
}

function handleSignOut() {
  firebase.auth().signOut();
  closeProfileModal();
}

// ── Keyboard shortcuts handler ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Always let Escape close the profile modal
  if (e.key === 'Escape') closeProfileModal();

  // Don't fire game shortcuts when typing in an input
  if (document.activeElement.tagName === 'INPUT') return;

  // Ctrl+Enter → new game (works on any panel, any game state)
  if (e.key === 'Enter' && e.ctrlKey) {
    e.preventDefault();
    newGame();
    return;
  }

  // Everything below only applies while the play panel is active
  if (!document.getElementById('panel-play').classList.contains('active')) return;
  // Don't fire if the arcana screen or replay overlay is open
  if (!document.getElementById('arcana-screen').classList.contains('hidden')) return;
  if (!document.getElementById('replay-overlay').classList.contains('hidden')) return;
  if (gameOver) return;

  // Space or Escape → clear selection
  if (e.key === ' ' || e.key === 'Escape') {
    e.preventDefault();
    selected.forEach(c => {
      const sprite = sprites.get(c);
      if (sprite) sprite.inner.classList.remove('selected');
    });
    selected = [];
    hintCards = [];
    for (const [, sprite] of sprites) sprite.inner.style.outline = '';
    return;
  }

  // Ignore key combos (Ctrl, Alt, Meta) for card selection
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  // Letter/number/symbol keys → select card at that board position
  const key = e.shiftKey ? e.key.toUpperCase() : e.key.toLowerCase();
  const layout = getKbLayout();
  const index = layout.indexOf(key);
  if (index >= 0 && index < board.length) {
    e.preventDefault();
    onCardClick(board[index]);
  }
});
document.getElementById('profile-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveProfileName();
});
